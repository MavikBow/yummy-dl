name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -e '.[dev]' && pytest

  windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Fetch ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          "FFMPEG=$((Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName)" >> $env:GITHUB_ENV
      - name: Build
        shell: pwsh
        run: ./scripts/build_windows.ps1 -BundleFfmpeg -FfmpegPath $env:FFMPEG
      - uses: actions/upload-artifact@v7
        with:
          name: yummy-dl-windows
          path: dist/yummy-dl-windows.zip
