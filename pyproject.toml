[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yummy-dl"
version = "0.1.0"
description = "Download Russian-dubbed anime from YummyAnime (personal use only)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.10"]

[project.scripts]
yummy-dl = "yummy_dl.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/yummy_dl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real network (opt-in: pytest -m live)"]
addopts = "-m 'not live'"
